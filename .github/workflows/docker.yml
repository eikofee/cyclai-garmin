name: docker

# Publishes ghcr.io/<owner>/cyclai-garmin when a version tag is pushed:
#   git tag v1.0.0 && git push --tags
#
# The plugin depends on the SDK that lives in the CyclAI repository
# (../cyclai/plugin-sdk), so that repository is checked out beside this one.
# If it is private, give the checkout a token with read access (`token:`).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: cyclai-garmin
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/cycl-ai
          path: cyclai
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/cyclai-garmin
      - uses: docker/build-push-action@v6
        with:
          context: cyclai-garmin
          build-contexts: sdk=cyclai/plugin-sdk
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
