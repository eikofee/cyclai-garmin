[package]
name = "cyclai-garmin"
version = "0.1.0"
edition = "2024"
description = "Garmin Connect activity-source plugin for CyclAI (Garmin Personal API, original .fit files)."

[dependencies]
# The protocol shared with CyclAI. Once it lives in its own repository, point
# this at the git URL instead of the sibling checkout.
cyclai-plugin-sdk = { path = "../cyclai/plugin-sdk", features = ["server"] }
tokio = { version = "1", features = ["full"] }
reqwest = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
anyhow = "1"
async-trait = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
